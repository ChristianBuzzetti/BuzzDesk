# Windows build: data tests, the self-contained app, the distributable zip and the README screenshots
# (build.ps1 -Zip -Shot runs BuzzDesk on a throwaway demo database). Artifacts: the zip, docs/*.png, shots.log.
name: build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      commit_screenshots:
        description: "Commit docs/*.png to this branch"
        type: boolean
        default: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Data and domain tests
        run: dotnet test tests/BuzzDesk.Tests --nologo -v q

      - name: Build, zip and screenshots
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\build.ps1 -Zip -Shot

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: BuzzDesk-win-x64
          path: artifacts/BuzzDesk-*-win-x64.zip

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            docs/*.png
            artifacts/shots/shots.log
          if-no-files-found: warn

      # Manual run with commit_screenshots, or a push whose message says [shots]: the README pictures go into the
      # branch (the bot's commit says [skip ci], so no loop).
      - name: Commit screenshots
        if: (github.event_name == 'workflow_dispatch' && inputs.commit_screenshots) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[shots]'))
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/*.png
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) { git commit -m "docs: README screenshots [skip ci]"; git push origin HEAD:${{ github.ref_name }} }
